<!DOCTYPE html>
<html>
<head>
    <title>Login - Tecnosystem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b1f3a;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
        }

        .logo {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="text-center mb-4">
    <img src="/img/logo11.png" style="width:440px; max-width:100%;">
</div>

    <div class="card p-4 shadow">

        <h4 class="text-center mb-3">Iniciar Sesión</h4>

        <input id="usuario" class="form-control mb-2" placeholder="Usuario">
        <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">

        <button onclick="login()" class="btn btn-primary w-100">
    Ingresar
</button>

    </div>

</div>

<script>
function login() {

    const usuario = document.getElementById('usuario').value;
    const password = document.getElementById('password').value;

    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
    })
    .then(res => res.json())
    .then(data => {

        if (data.error) {
            alert(data.error);
            return;
        }

        // 🔥 GUARDAR USUARIO
        localStorage.setItem('usuario', JSON.stringify(data));

        // 🔀 REDIRECCIÓN
        if (data.rol === 'TECNICO') {
            window.location = '/tecnico.html';
        } else {
            window.location = '/dashboard.html';
        }

    })
    .catch(err => {
        console.error(err);
        alert('Error de conexión');
    });
}

</script>

    // 🔐 GUARDAR SESIÓN
    localStorage.setItem('usuario', JSON.stringify(data));

    // 🚀 ENTRAR AL SISTEMA
    window.location = '/dashboard.html';
}

</script>

</body>
</html>
