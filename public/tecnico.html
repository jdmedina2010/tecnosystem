<!DOCTYPE html>
<html>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="layout.js"></script>

<script>
cargarLayout(`
<h2>Panel Técnico</h2>

<table class="table table-hover">
<thead class="table-dark">
<tr>
<th>#</th>
<th>Cliente</th>
<th>Equipo</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<!-- MODAL -->
<div class="modal fade" id="modal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content p-3">

<h5>Diagnóstico</h5>

<!-- 🔹 DATOS -->
<div class="mb-2">
    <b>Cliente:</b> <span id="m_cliente"></span><br>
    <b>Equipo:</b> <span id="m_equipo"></span><br>
    <b>Serial:</b> <span id="m_serial"></span>
</div>

<div class="mb-2">
    <b>Problema:</b>
    <div id="m_problema" class="border p-2 bg-light"></div>
</div>

<!-- 🔥 INPUT FOTO -->
<input type="file" id="foto" multiple class="form-control mb-2">

<!-- 🔹 CAMPOS -->
<textarea id="diagnostico" class="form-control mb-2" placeholder="Diagnóstico"></textarea>

<textarea id="observaciones" class="form-control mb-2" placeholder="Observaciones"></textarea>

<!-- 🔹 BOTONES -->
<button onclick="finalizar('REPARADO')" class="btn btn-success w-100 mb-2">
✅ Reparado
</button>

<button onclick="finalizar('NO REPARADO')" class="btn btn-danger w-100">
❌ No Reparado
</button>

<hr>

<!-- 🔥 HISTORIAL -->
<h6>📜 Historial</h6>
<div id="historial" style="max-height:150px; overflow:auto; font-size:13px;"></div>

</div>
</div>
</div>
`);

let ordenActual = null;

// CARGAR ORDENES
function cargar() {
    fetch('/ordenes')
    .then(r => r.json())
    .then(data => {

        let t = document.getElementById('tabla');
        t.innerHTML = '';

        data.forEach(o => {

            t.innerHTML += `
            <tr>
                <td>${o.id}</td>
                <td>${o.nombre}</td>
                <td>${o.marca} ${o.modelo}</td>
                <td>${o.estado}</td>
                <td>
                    <button class="btn btn-warning btn-sm"
                     onclick="abrir(${o.id})">
                     Atender
                     </button>
                </td>
            </tr>
            `;
        });
    });
}function finalizar(estado) {

    let formData = new FormData();

    formData.append('id', ordenActual);
    formData.append('estado', estado);
    formData.append('diagnostico', document.getElementById('diagnostico').value);
    formData.append('observaciones', document.getElementById('observaciones').value);

    let archivos = document.getElementById('foto').files;

for (let i = 0; i < archivos.length; i++) {
    formData.append('foto', archivos[i]);
}

    fetch('/ordenes/finalizar', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);
        alert('Orden actualizada');
        location.reload();
    })
    .catch(err => {
        console.error(err);
        alert('Error al guardar');
    });
}

// ABRIR MODAL
function abrir(id) {

    ordenActual = id;

    fetch('/ordenes')
    .then(r => r.json())
    .then(data => {

        let o = data.find(x => x.id == id);

        if (!o) return;

        // 🔹 DATOS
        document.getElementById('m_cliente').innerText = o.nombre;
        document.getElementById('m_equipo').innerText = o.marca + ' ' + o.modelo;
        document.getElementById('m_serial').innerText = o.serial;

        

        // 🔥 PROBLEMA
        document.getElementById('m_problema').innerText = o.descripcion;

        // 🔹 ABRIR MODAL
        let modal = new bootstrap.Modal(document.getElementById('modal'));
        modal.show();
        // 🔥 HISTORIAL
fetch('/historial/' + o.serial)
.then(r => r.json())
.then(hist => {

    console.log(hist);

    let h = document.getElementById('historial');

    h.innerHTML = '';

    // 🔥 SI NO ES ARRAY
    if (!Array.isArray(hist)) {
        h.innerHTML = 'Sin historial';
        return;
    }

    hist.forEach(x => {

        h.innerHTML += `
        <div style="border-bottom:1px solid #ddd; margin-bottom:5px; padding-bottom:5px;">

            <b>#${x.id}</b> - ${x.estado}<br>

            <small>${x.fecha_ingreso}</small><br>

            <i>${x.diagnostico || 'Sin diagnóstico'}</i>

            <div style="margin-top:5px;">

                ${
                    x.foto
                    ? x.foto.split('|').map(f => `
                        <img src="${f}" 
                        style="
                        width:90px;
                        height:90px;
                        object-fit:cover;
                        margin:4px;
                        border-radius:8px;
                        border:1px solid #ccc;
                        cursor:pointer;
                        "
                        onclick="window.open('${f}')"
                        >
                    `).join('')
                    : ''
                }

            </div>

        </div>
        `;
    });

});    });
    
}
cargar();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
